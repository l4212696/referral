<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referral</title>
<style>
  :root {
    --bg: #f3f8f6; --card: #ffffff; --ink: #10231d; --muted: #5b6f68;
    --green: #26a17b; --green-dark: #1c7e60; --line: #d5e4de; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c1613; --card: #12211c; --ink: #e8f3ef; --muted: #8fa89f; --line: #23382f; --err: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
         background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
         border-radius: 14px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 1.4rem; }
  p.sub { margin: 0 0 22px; color: var(--muted); }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; padding: 12px 14px; font: inherit; color: inherit; background: transparent;
          border: 1px solid var(--line); border-radius: 8px; }
  input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  button { width: 100%; margin-top: 20px; padding: 12px; font: inherit; font-weight: 600; color: #fff;
           background: var(--green); border: 0; border-radius: 8px; cursor: pointer; }
  button:hover { background: var(--green-dark); }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 1.4em; margin-top: 12px; color: var(--err); font-size: .92rem; }
  .done { text-align: center; }
  textarea { width: 100%; min-height: 130px; padding: 12px 14px; font: inherit; color: inherit; background: transparent;
             border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  textarea:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  fieldset { border: 0; padding: 0; margin: 14px 0 0; }
  legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
  .stars { display: flex; gap: 6px; }
  .stars input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .stars label { margin: 0; font-size: 1.8rem; line-height: 1; cursor: pointer; color: var(--line); }
  .stars label.on { color: var(--green); }
  .stars input:focus-visible + label { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 4px; }
  .count { text-align: right; color: var(--muted); font-size: .85rem; margin-top: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="step1">
    <h1>Enter your referral code</h1>
    <p class="sub">Use the code you were given to continue.</p>
    <form id="codeForm" novalidate>
      <label for="code">Referral code</label>
      <input id="code" name="code" autocomplete="off" required>
      <button type="submit">Continue</button>
      <div class="msg" role="alert"></div>
    </form>
  </section>

  <section id="step2" hidden>
    <h1>Your details</h1>
    <p class="sub">Code accepted. Tell us who you are.</p>
    <form id="detailsForm" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" autocomplete="name" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button type="submit">Submit</button>
      <div class="msg" role="alert"></div>
    </form>
  </section>

  <section id="step3" hidden>
    <h1>Leave a message</h1>
    <p class="sub">Share a message or review.</p>
    <form id="messageForm" novalidate>
      <fieldset>
        <legend>Rating (optional)</legend>
        <div class="stars" id="stars"></div>
      </fieldset>
      <label for="message">Message</label>
      <textarea id="message" name="message" maxlength="1000" required></textarea>
      <div class="count"><span id="count">0</span>/1000</div>
      <button type="submit">Send message</button>
      <div class="msg" role="alert"></div>
    </form>
  </section>

  <section id="step4" class="done" hidden>
    <h1>Thank you</h1>
    <p class="sub">Your message was submitted.</p>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let referralCode = "", token = "", rating = "";

  async function post(url, body) {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Something went wrong. Try again.");
    return data;
  }

  function wire(formId, onSubmit) {
    const form = $(formId), btn = form.querySelector("button"), msg = form.querySelector(".msg");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = ""; btn.disabled = true;
      try { await onSubmit(); } catch (err) { msg.textContent = err.message; }
      btn.disabled = false;
    });
  }

  wire("codeForm", async () => {
    const code = $("code").value.trim();
    if (!code) throw new Error("Enter your referral code.");
    await post("/api/referral", { code });
    referralCode = code;
    $("step1").hidden = true; $("step2").hidden = false; $("name").focus();
  });

  wire("detailsForm", async () => {
    const name = $("name").value.trim(), email = $("email").value.trim();
    if (!name) throw new Error("Enter your name.");
    if (!email) throw new Error("Enter your email.");
    const data = await post("/api/submit", { name, email, code: referralCode });
    token = data.token;
    $("step2").hidden = true; $("step3").hidden = false; $("message").focus();
  });

  // Star rating (optional)
  const stars = $("stars");
  for (let i = 1; i <= 5; i++) {
    stars.insertAdjacentHTML("beforeend",
      `<input type="radio" name="rating" id="r${i}" value="${i}"><label for="r${i}" title="${i} star${i > 1 ? "s" : ""}">&#9733;</label>`);
  }
  stars.addEventListener("change", (e) => {
    rating = e.target.value;
    stars.querySelectorAll("label").forEach((l, idx) => l.classList.toggle("on", idx < Number(rating)));
  });

  $("message").addEventListener("input", (e) => { $("count").textContent = e.target.value.length; });

  wire("messageForm", async () => {
    const message = $("message").value.trim();
    if (!message) throw new Error("Write a message.");
    await post("/api/message", { token, message, rating });
    $("step3").hidden = true; $("step4").hidden = false;
  });
</script>
</body>
</html>
